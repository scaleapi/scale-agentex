name: Promote SDKs to production

# Fast-forwards each production SDK trunk from its staging trunk.
#
# Deliberately NOT in the SDK repos, where upstream's example puts it. That layout
# needs a PRODUCTION_REPO_TOKEN secret in every staging repo; here the config repo
# already holds the agentex-sdk-sync App credentials and the App is installed on all
# four SDK repos, so promoting from here needs no new secret anywhere and keeps the
# App's private key in one place. The tradeoff is that upstream changes to their
# example no longer drop in unmodified.
#
# Manual only. Promotion is a release decision, not something to fire on every push.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated targets to promote, or "all"'
        required: false
        default: all
      dry_run:
        description: 'Report what would happen without pushing'
        type: boolean
        required: false
        default: false

concurrency:
  # Never promote two runs at once: both push the same production trunks.
  group: stlc-promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ${{ vars.STLC_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve SDK repos from the workspace config
        # Derives the token's repository scope from the same stainless.yml the promote
        # loop reads. A hardcoded list silently rots: adding a target would make the
        # loop discover it and then fail on a fetch the token was never scoped for.
        id: repos
        working-directory: stainless
        run: |
          set -euo pipefail

          all=$(yq -r '.targets | to_entries[] | [.value.staging_repo, .value.production_repo] | .[] | select(. != null and . != "null")' stainless.yml | sort -u)

          # The token is minted with `owner: scaleapi`, so every repo must live there --
          # a cross-org target needs a second mint, not a silently truncated name.
          if foreign=$(printf '%s\n' "$all" | grep -v '^scaleapi/' || true); [ -n "$foreign" ]; then
            echo "::error title=Unsupported target repo::stainless.yml references repos outside the scaleapi org, which this workflow's single token cannot cover:%0A${foreign}"
            exit 1
          fi

          list=$(printf '%s\n' "$all" | sed 's#^scaleapi/##' | paste -sd, -)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Token will be scoped to: $list"

      - name: Mint SDK promote token
        # Writes production, so it is scoped to contents + workflows on only the SDK
        # repos stainless.yml actually names. No pull-requests: a fast-forward opens
        # nothing.
        #
        # `workflows: write` is NOT optional, and omitting it is what made the first
        # real promote fail: GitHub refuses a push from a GitHub App that creates or
        # updates any .github/workflows/** file without it. A trunk fast-forward
        # carries whatever the diff contains, and this one carries release-please.yml.
        # I originally dropped it reasoning that a fast-forward "needs neither" --
        # that confuses what the operation is called with what it moves.
        #
        # NOTE: this token can write the production SDK repos, which no token in
        # stlc-generate.yml can. That asymmetry is deliberate: generation must never be
        # able to reach production, and promotion is the one place that may.
        id: promote-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENTEX_SDK_SYNC_APP_ID }}
          private-key: ${{ secrets.AGENTEX_SDK_SYNC_PRIVATE_KEY }}
          owner: scaleapi
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: write
          permission-workflows: write
          # PR mode (below) opens and updates a promote pull request on production.
          permission-pull-requests: write
          permission-metadata: read

      - name: Promote each target
        working-directory: stainless
        env:
          GH_TOKEN: ${{ steps.promote-token.outputs.token }}
          TARGETS: ${{ inputs.targets }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Fixed name so the pull request is reusable across runs rather than
          # accumulating one per promote. Force-pushed each time; it is disposable.
          PROMOTE_BRANCH: stlc/promote
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail

          WORK=$(mktemp -d)
          PLAN="$WORK/plan.tsv"; : > "$PLAN"
          pushed=""; planned=""; insync=""; forked=""; waiting=""; blocked=""

          # The summary must survive an unexpected failure. Under `set -e` a fetch or
          # push error exits the script, and without this trap the operator is pointed
          # at a summary that says nothing about which targets already reached
          # production -- the one fact they need.
          summary_done=0
          finish() {
            rc=$?
            if [ "$summary_done" = "0" ]; then
              summary_done=1
              {
                if [ "$DRY_RUN" = "true" ]; then
                  echo "### stlc promote — DRY RUN (nothing was pushed)"
                else
                  echo "### stlc promote"
                fi
                echo ""
                [ -n "$planned" ] && [ "$DRY_RUN" = "true" ] && echo "- would promote:$planned" || true
                [ -n "$pushed" ] && echo "- **pushed to production:**$pushed" || true
                [ -n "$waiting" ] && echo "- awaiting checks + approval:$waiting — approve the pull request, then re-run this workflow" || true
                [ -n "$insync" ] && echo "- already in sync:$insync" || true
                [ -n "$forked" ] && echo "- **blocked (forked trunk):**$forked" || true
                [ -n "$blocked" ] && echo "- **blocked:**$blocked" || true
                # Only worth shouting about when production was partially written --
                # a validation failure with nothing pushed is already self-evident
                # from the error annotation.
                if [ "$rc" != "0" ] && [ -n "$pushed" ]; then
                  echo ""
                  echo "⚠️ exited mid-run (rc=$rc). The targets under **pushed to production** already landed; the rest did not. Production trunks may now differ from each other."
                fi
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -rf "$WORK"
          }
          trap finish EXIT

          yq -r '.targets | to_entries[] | [.key, (.value.staging_repo // .value.production_repo), (.value.production_repo // .value.staging_repo)] | @tsv' stainless.yml > "$WORK/configured.tsv"
          configured=$(cut -f1 "$WORK/configured.tsv" | paste -sd' ' -)

          # Split on comma and trim. The input is documented as comma-separated, and
          # `python, typescript` is the natural way to write it -- an exact match on
          # ",${target}," silently drops every entry that carries a space, promoting a
          # subset while reporting success. An unrecognised name is an error, not a
          # no-op: a typo must not look like a clean run.
          selected=""
          if [ "$(printf '%s' "$TARGETS" | tr -d '[:space:]')" = "all" ]; then
            selected="$configured"
          else
            unknown=""
            while IFS= read -r raw; do
              t=$(printf '%s' "$raw" | tr -d '[:space:]')
              [ -z "$t" ] && continue
              if printf '%s\n' $configured | grep -qx -- "$t"; then
                selected="$selected $t"
              else
                unknown="$unknown $t"
              fi
            done <<< "$(printf '%s' "$TARGETS" | tr ',' '\n')"
            if [ -n "$unknown" ]; then
              echo "::error title=Unknown target::not configured in stainless.yml:$unknown%0AConfigured targets: $configured"
              exit 1
            fi
            [ -z "$selected" ] && { echo "::error title=No targets selected::input was '$TARGETS'"; exit 1; }
          fi
          echo "Selected:$selected"

          # PASS 1 -- evaluate every selected target, write nothing.
          #
          # Splitting evaluation from pushing is the whole point. Pushing inside the
          # loop means an early target can reach production and a later forked target
          # then fails the job, leaving the production trunks inconsistent with each
          # other -- a worse state than not promoting at all, and one this workflow
          # otherwise exists to prevent.
          while IFS=$'\t' read -r target staging prod; do
            case " $selected " in *" $target "*) ;; *) continue ;; esac
            { [ -z "$prod" ] || [ "$prod" = "null" ] || [ "$staging" = "$prod" ]; } && continue

            echo "::group::check $target"
            staging_url="https://x-access-token:${GH_TOKEN}@github.com/${staging}.git"
            prod_url="https://x-access-token:${GH_TOKEN}@github.com/${prod}.git"

            d="$WORK/$target"; mkdir -p "$d"; git -C "$d" init -q
            git -C "$d" -c credential.helper= fetch -q "$staging_url" main:refs/remotes/staging/main
            git -C "$d" -c credential.helper= fetch -q "$prod_url" main:refs/remotes/prod/main

            # Content compare before SHA compare. After a release production carries
            # release-please commits staging lacks, so it is not "behind" even though
            # the SHAs differ -- comparing trees is what stops a promote that would
            # undo a release.
            merged=$(git -C "$d" merge-tree --write-tree prod/main staging/main) || merged=conflict
            prod_tree=$(git -C "$d" rev-parse 'prod/main^{tree}')
            if [ "$merged" = "$prod_tree" ]; then
              echo "production already has staging's content."
              # Content is the right question for "is there anything to promote?", but
              # it is not the question the codegen hold asks. The hold needs production
              # to be an ANCESTOR of staging, and identical trees do not imply that --
              # a rebase or cherry-picked release gives the same content from different
              # commits. Promote cannot repair that (a fast-forward is impossible once
              # the trunks fork); the back-sync owns the repair. But say so, because
              # otherwise every surface reports healthy while codegen stays held.
              if ! git -C "$d" merge-base --is-ancestor prod/main staging/main; then
                echo "::warning title=Forked trunk for ${target}::nothing to promote, but production/main is not an ancestor of staging main, so the codegen hold is blocking builds for this target. Identical content, divergent history. Merge production into staging (never rebase) to clear it."
              fi
              insync="$insync $target"
              echo "::endgroup::"; continue
            fi

            # Fast-forward only. A forked trunk cannot be resolved by a push; it needs
            # a MERGE in the staging repo, by a human. Rebase and cherry-pick rewrite
            # SHAs and leave this check failing on every later run.
            if ! git -C "$d" merge-base --is-ancestor prod/main staging/main; then
              echo "::error title=Promote blocked for ${target}::production/main is not an ancestor of staging main. The trunks have forked; back-sync production into staging (merge, do not rebase) and re-run."
              forked="$forked $target"
              echo "::endgroup::"; continue
            fi

            from=$(git -C "$d" rev-parse --short prod/main)
            to=$(git -C "$d" rev-parse --short staging/main)
            to_full=$(git -C "$d" rev-parse staging/main)

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$target" "$prod_url" "$prod" "$from" "$to" "$to_full" >> "$PLAN"
            planned="$planned $target"
            echo "ready: ${prod} main ${from} -> ${to}"
            echo "::endgroup::"
          done < "$WORK/configured.tsv"

          # Gate: refuse the whole run if any selected target is forked. Nothing has
          # been written yet, so this leaves production untouched rather than partly
          # promoted.
          if [ -n "$forked" ]; then
            echo "::error title=Promote aborted::forked trunk for:$forked — nothing was pushed. Reconcile and re-run."
            exit 1
          fi

          if [ -z "$planned" ]; then
            echo "Nothing to promote."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — would promote:$planned"
            exit 0
          fi

          # PASS 2 -- land. Every selected target has already passed its checks.
          #
          # Two modes, because the production repos differ. A trunk with no required
          # status checks takes the fast-forward directly. A trunk that HAS them
          # cannot: fresh commits carry no check runs, so the push is refused. For
          # those, stage the exact same commits on a branch, let CI run on those
          # SHAs, and fast-forward main only once the checks are green and a human
          # has approved. Same commits either way -- the trunks stay byte-identical,
          # which a squash or rebase merge would destroy.
          while IFS=$'\t' read -r target prod_url prod from to to_full; do
            echo "::group::land $target"
            d="$WORK/$target"

            # An in-flight promote pull request GOVERNS: its gates are checked BEFORE
            # main is touched. Ordering is the whole safety property here. Attempting
            # the push first looks equivalent and is not -- once CI goes green on the
            # staged SHA the required-checks gate is satisfied and the App's bypass
            # covers the pull-request requirement, so the push SUCCEEDS with the pull
            # request still unapproved. That silently removes the human gate this mode
            # exists to provide.
            #
            # --state open matters: gh resolves a branch to its most recent pull
            # request regardless of state, so after a previous promote this would find
            # the CLOSED one, skip creating a new one, and then report progress against
            # a pull request that can never merge.
            # Fail CLOSED. `|| echo ''` here would turn a transient API error into
            # "no pull request governs", and the fast-forward below would then land
            # unapproved commits the moment the staged SHA's checks happened to be
            # green -- the same gate-skipping this ordering exists to prevent.
            if ! pr=$(gh pr list --repo "$prod" --head "$PROMOTE_BRANCH" --state open --json number --jq '.[0].number // empty'); then
              echo "::error title=Promote blocked for ${target}::could not query pull requests on ${prod}; refusing to touch main without knowing whether one is in flight."
              blocked="$blocked $target"; echo "::endgroup::"; continue
            fi
            staged=$(git -C "$d" -c credential.helper= ls-remote "$prod_url" "refs/heads/$PROMOTE_BRANCH" | cut -f1)

            if [ -n "$pr" ]; then
              if [ "$staged" != "$to_full" ]; then
                # Staging moved while this was in flight. The existing approval was
                # given for different commits, and it would SURVIVE a force-push --
                # this repo has dismiss_stale_reviews=false and
                # require_last_push_approval=false. Reusing the pull request would let
                # an approval of the old SHA authorise the new one, so close it and
                # open a fresh one that carries no reviews.
                gh pr close "$pr" --repo "$prod" --comment "Superseded: the staging trunk advanced to ${to} while this was open. Closing rather than force-pushing, because an approval here would otherwise carry over to commits nobody reviewed." >/dev/null || true
                git -C "$d" -c credential.helper= push --force "$prod_url" "staging/main:refs/heads/$PROMOTE_BRANCH"
                pr=""
              else
                review=$(gh pr view "$pr" --repo "$prod" --json reviewDecision --jq '.reviewDecision // "NONE"')
                rollup=$(gh pr view "$pr" --repo "$prod" --json statusCheckRollup --jq '.statusCheckRollup')
                failing=$(printf '%s' "$rollup" | jq -r '[.[]? | select((.conclusion // .state // "") | test("FAILURE|ERROR|CANCELLED"))] | length')
                pending=$(printf '%s' "$rollup" | jq -r '[.[]? | select(((.conclusion // "") == "") and ((.state // "") != "SUCCESS"))] | length')

                if [ "$failing" != "0" ]; then
                  echo "::error title=Promote blocked for ${target}::pull request #${pr} has ${failing} failing check(s). Fix them on the staging trunk, not on this branch -- it is overwritten on every promote."
                  blocked="$blocked $target"; echo "::endgroup::"; continue
                fi
                if [ "$pending" != "0" ]; then
                  echo "#${pr}: ${pending} check(s) still running — re-run once green."
                  waiting="$waiting ${target}(#${pr})"; echo "::endgroup::"; continue
                fi
                if [ "$review" != "APPROVED" ]; then
                  echo "#${pr} is green but not approved (reviewDecision=${review}) — approve it, then re-run."
                  waiting="$waiting ${target}(#${pr})"; echo "::endgroup::"; continue
                fi

                # Green AND approved. The required checks are satisfied for this exact
                # SHA, so the fast-forward is accepted.
                if ! err=$(git -C "$d" -c credential.helper= push "$prod_url" staging/main:refs/heads/main 2>&1); then
                  echo "$err"
                  echo "::error title=Promote failed for ${target}::#${pr} is green and approved but the fast-forward was refused."
                  blocked="$blocked $target"; echo "::endgroup::"; continue
                fi
                pushed="$pushed $target"
                planned=$(printf '%s' "$planned" | sed "s/ $target\b//")
                echo "promoted ${from} -> ${to} via #${pr}"
                git -C "$d" -c credential.helper= push "$prod_url" --delete "refs/heads/$PROMOTE_BRANCH" >/dev/null 2>&1 || echo "::warning::could not delete ${PROMOTE_BRANCH} on ${prod}"
                echo "::endgroup::"; continue
              fi
            fi

            # No pull request governs this target. Decide the mode by ATTEMPTING the
            # fast-forward rather than reading the production repo's protection: that
            # endpoint needs Administration: read, which this App does not hold, and a
            # silently-failed lookup would pick the fast-forward for exactly the trunk
            # that cannot accept one. A rejected push changes nothing.
            if [ -z "$pr" ] && [ "$staged" != "$to_full" ]; then
              if err=$(git -C "$d" -c credential.helper= push "$prod_url" staging/main:refs/heads/main 2>&1); then
                pushed="$pushed $target"
                planned=$(printf '%s' "$planned" | sed "s/ $target\b//")
                echo "promoted ${from} -> ${to}"
                [ -n "$staged" ] && git -C "$d" -c credential.helper= push "$prod_url" --delete "refs/heads/$PROMOTE_BRANCH" >/dev/null 2>&1 || true
                echo "::endgroup::"; continue
              fi

              # Only this one rejection means "use a pull request". Anything else is a
              # real failure and must not be silently reinterpreted.
              if ! printf '%s' "$err" | grep -qi "required status check"; then
                echo "$err"
                echo "::error title=Promote failed for ${target}::push to ${prod} main was rejected for a reason other than required status checks."
                blocked="$blocked $target"; echo "::endgroup::"; continue
              fi
              echo "direct push refused by required status checks — staging a pull request."
              git -C "$d" -c credential.helper= push --force "$prod_url" "staging/main:refs/heads/$PROMOTE_BRANCH"
            fi

            # Open a pull request for the staged commits. Never merged by this
            # workflow: this repo allows squash only, and squash rewrites SHAs, which
            # forks the production trunk from staging and blocks all codegen.
            body=$(printf '%s\n' \
              "Automated promote from the staging trunk, opened by stlc-promote.yml." \
              "" \
              "**Approve this pull request - do not click Merge.** Squash and rebase both rewrite SHAs, which forks the production trunk away from staging and blocks all codegen until someone reconciles them by hand. Merge commits are disabled on this repo." \
              "" \
              "Once CI is green here and this has one approval, re-run \`stlc-promote.yml\` in the config repo. It fast-forwards \`main\` to these exact commits, GitHub closes this pull request as merged, and the trunks stay byte-identical.")
            gh pr create --repo "$prod" --base main --head "$PROMOTE_BRANCH" \
              --title "promote: staging ${to} to production" \
              --body "$body" >/dev/null
            pr=$(gh pr list --repo "$prod" --head "$PROMOTE_BRANCH" --state open --json number --jq '.[0].number')
            echo "staged ${to} on ${PROMOTE_BRANCH}; pull request #${pr} awaiting checks + approval"
            waiting="$waiting ${target}(#${pr})"
            echo "::endgroup::"
          done < "$PLAN"

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.STLC_ALERT_WEBHOOK_URL }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="stlc promote failed in ${{ github.repository }}. Production trunks may be partially promoted — check the step summary before re-running. Run: $run_url"
          echo "::error title=stlc promote failed::$msg"
          { echo "### ⚠️ stlc promote failed"; echo ""; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ALERT_WEBHOOK_URL:-}" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg text "$msg" '{text:$text}')" "$ALERT_WEBHOOK_URL" \
              || echo "::warning::Alert webhook POST failed"
          fi
