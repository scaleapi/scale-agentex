name: Promote SDKs to production

# Promotes each production SDK trunk from its staging trunk, through a reviewed
# pull request.
#
# Deliberately NOT in the SDK repos, where upstream's example puts it. That layout
# needs a PRODUCTION_REPO_TOKEN secret in every staging repo; here the config repo
# already holds the agentex-sdk-sync App credentials and the App is installed on all
# four SDK repos, so promoting from here needs no new secret anywhere and keeps the
# App's private key in one place. The tradeoff is that upstream changes to their
# example no longer drop in unmodified.
#
# Manual only. Promotion is a release decision, not something to fire on every push.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated targets to promote, or "all"'
        required: false
        default: all
      dry_run:
        description: 'Report what would happen without pushing'
        type: boolean
        required: false
        default: false

concurrency:
  # Never promote two runs at once: both push the same production trunks.
  group: stlc-promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ${{ vars.STLC_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve SDK repos from the workspace config
        # Derives the token's repository scope from the same stainless.yml the promote
        # loop reads. A hardcoded list silently rots: adding a target would make the
        # loop discover it and then fail on a fetch the token was never scoped for.
        id: repos
        working-directory: stainless
        run: |
          set -euo pipefail

          all=$(yq -r '.targets | to_entries[] | [.value.staging_repo, .value.production_repo] | .[] | select(. != null and . != "null")' stainless.yml | sort -u)

          # The token is minted with `owner: scaleapi`, so every repo must live there --
          # a cross-org target needs a second mint, not a silently truncated name.
          if foreign=$(printf '%s\n' "$all" | grep -v '^scaleapi/' || true); [ -n "$foreign" ]; then
            echo "::error title=Unsupported target repo::stainless.yml references repos outside the scaleapi org, which this workflow's single token cannot cover:%0A${foreign}"
            exit 1
          fi

          list=$(printf '%s\n' "$all" | sed 's#^scaleapi/##' | paste -sd, -)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Token will be scoped to: $list"

      - name: Mint SDK promote token
        # Writes production, so it is scoped to contents + workflows on only the SDK
        # repos stainless.yml actually names. No pull-requests: a fast-forward opens
        # nothing.
        #
        # `workflows: write` is NOT optional, and omitting it is what made the first
        # real promote fail: GitHub refuses a push from a GitHub App that creates or
        # updates any .github/workflows/** file without it. A trunk fast-forward
        # carries whatever the diff contains, and this one carries release-please.yml.
        # I originally dropped it reasoning that a fast-forward "needs neither" --
        # that confuses what the operation is called with what it moves.
        #
        # NOTE: this token can write the production SDK repos, which no token in
        # stlc-generate.yml can. That asymmetry is deliberate: generation must never be
        # able to reach production, and promotion is the one place that may.
        id: promote-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENTEX_SDK_SYNC_APP_ID }}
          private-key: ${{ secrets.AGENTEX_SDK_SYNC_PRIVATE_KEY }}
          owner: scaleapi
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: write
          permission-workflows: write
          # PR mode (below) opens and updates a promote pull request on production.
          permission-pull-requests: write
          permission-metadata: read

      - name: Promote each target
        working-directory: stainless
        env:
          GH_TOKEN: ${{ steps.promote-token.outputs.token }}
          TARGETS: ${{ inputs.targets }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Fixed name so the pull request is reusable across runs rather than
          # accumulating one per promote. Force-pushed each time; it is disposable.
          PROMOTE_BRANCH: stlc/promote
          # Checks that must have reported an actual SUCCESS on the staged commits
          # before main is fast-forwarded. Naming them is the gate. "Nothing failed and
          # nothing is pending" is also true of a pull request no check has reported on
          # yet, and true of one where only third-party scanners passed while the test
          # suite never ran -- neither is evidence the commits are good.
          #
          # These are the ci.yml job names both production repos share. Each must be a
          # job whose check run reaches SUCCESS; a job that is SKIPPED does not count. A
          # target whose CI names its jobs differently has to be added here, or its
          # promote waits forever with "missing a SUCCESS from".
          PROMOTE_REQUIRED_CHECKS: lint build test
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail

          WORK=$(mktemp -d)
          PLAN="$WORK/plan.tsv"; : > "$PLAN"
          pushed=""; planned=""; insync=""; forked=""; waiting=""; blocked=""

          # The summary must survive an unexpected failure. Under `set -e` a fetch or
          # push error exits the script, and without this trap the operator is pointed
          # at a summary that says nothing about which targets already reached
          # production -- the one fact they need.
          summary_done=0
          finish() {
            rc=$?
            if [ "$summary_done" = "0" ]; then
              summary_done=1
              {
                if [ "$DRY_RUN" = "true" ]; then
                  echo "### stlc promote — DRY RUN (nothing was pushed)"
                else
                  echo "### stlc promote"
                fi
                echo ""
                [ -n "$planned" ] && [ "$DRY_RUN" = "true" ] && echo "- would promote:$planned" || true
                [ -n "$pushed" ] && echo "- **pushed to production:**$pushed" || true
                [ -n "$waiting" ] && echo "- awaiting checks + approval:$waiting — approve the pull request, then re-run this workflow" || true
                [ -n "$insync" ] && echo "- already in sync:$insync" || true
                [ -n "$forked" ] && echo "- **blocked (forked trunk):**$forked" || true
                [ -n "$blocked" ] && echo "- **blocked:**$blocked" || true
                # Only worth shouting about when production was partially written --
                # a validation failure with nothing pushed is already self-evident
                # from the error annotation.
                if [ "$rc" != "0" ] && [ -n "$pushed" ]; then
                  echo ""
                  echo "⚠️ exited mid-run (rc=$rc). The targets under **pushed to production** already landed; the rest did not. Production trunks may now differ from each other."
                fi
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -rf "$WORK"
          }
          trap finish EXIT

          yq -r '.targets | to_entries[] | [.key, (.value.staging_repo // .value.production_repo), (.value.production_repo // .value.staging_repo)] | @tsv' stainless.yml > "$WORK/configured.tsv"
          configured=$(cut -f1 "$WORK/configured.tsv" | paste -sd' ' -)

          # Split on comma and trim. The input is documented as comma-separated, and
          # `python, typescript` is the natural way to write it -- an exact match on
          # ",${target}," silently drops every entry that carries a space, promoting a
          # subset while reporting success. An unrecognised name is an error, not a
          # no-op: a typo must not look like a clean run.
          selected=""
          if [ "$(printf '%s' "$TARGETS" | tr -d '[:space:]')" = "all" ]; then
            selected="$configured"
          else
            unknown=""
            while IFS= read -r raw; do
              t=$(printf '%s' "$raw" | tr -d '[:space:]')
              [ -z "$t" ] && continue
              if printf '%s\n' $configured | grep -qx -- "$t"; then
                selected="$selected $t"
              else
                unknown="$unknown $t"
              fi
            done <<< "$(printf '%s' "$TARGETS" | tr ',' '\n')"
            if [ -n "$unknown" ]; then
              echo "::error title=Unknown target::not configured in stainless.yml:$unknown%0AConfigured targets: $configured"
              exit 1
            fi
            [ -z "$selected" ] && { echo "::error title=No targets selected::input was '$TARGETS'"; exit 1; }
          fi
          echo "Selected:$selected"

          # PASS 1 -- evaluate every selected target, write nothing.
          #
          # Splitting evaluation from pushing is the whole point. Pushing inside the
          # loop means an early target can reach production and a later forked target
          # then fails the job, leaving the production trunks inconsistent with each
          # other -- a worse state than not promoting at all, and one this workflow
          # otherwise exists to prevent.
          while IFS=$'\t' read -r target staging prod; do
            case " $selected " in *" $target "*) ;; *) continue ;; esac
            { [ -z "$prod" ] || [ "$prod" = "null" ] || [ "$staging" = "$prod" ]; } && continue

            echo "::group::check $target"
            staging_url="https://x-access-token:${GH_TOKEN}@github.com/${staging}.git"
            prod_url="https://x-access-token:${GH_TOKEN}@github.com/${prod}.git"

            d="$WORK/$target"; mkdir -p "$d"; git -C "$d" init -q
            git -C "$d" -c credential.helper= fetch -q "$staging_url" main:refs/remotes/staging/main
            git -C "$d" -c credential.helper= fetch -q "$prod_url" main:refs/remotes/prod/main

            # Content compare before SHA compare. After a release production carries
            # release-please commits staging lacks, so it is not "behind" even though
            # the SHAs differ -- comparing trees is what stops a promote that would
            # undo a release.
            merged=$(git -C "$d" merge-tree --write-tree prod/main staging/main) || merged=conflict
            prod_tree=$(git -C "$d" rev-parse 'prod/main^{tree}')
            if [ "$merged" = "$prod_tree" ]; then
              echo "production already has staging's content."
              # Content is the right question for "is there anything to promote?", but
              # it is not the question the codegen hold asks. The hold needs production
              # to be an ANCESTOR of staging, and identical trees do not imply that --
              # a rebase or cherry-picked release gives the same content from different
              # commits. Promote cannot repair that (a fast-forward is impossible once
              # the trunks fork); the back-sync owns the repair. But say so, because
              # otherwise every surface reports healthy while codegen stays held.
              if ! git -C "$d" merge-base --is-ancestor prod/main staging/main; then
                echo "::warning title=Forked trunk for ${target}::nothing to promote, but production/main is not an ancestor of staging main, so the codegen hold is blocking builds for this target. Identical content, divergent history. Merge production into staging (never rebase) to clear it."
              fi
              insync="$insync $target"
              echo "::endgroup::"; continue
            fi

            # Fast-forward only. A forked trunk cannot be resolved by a push; it needs
            # a MERGE in the staging repo, by a human. Rebase and cherry-pick rewrite
            # SHAs and leave this check failing on every later run.
            if ! git -C "$d" merge-base --is-ancestor prod/main staging/main; then
              echo "::error title=Promote blocked for ${target}::production/main is not an ancestor of staging main. The trunks have forked; back-sync production into staging (merge, do not rebase) and re-run."
              forked="$forked $target"
              echo "::endgroup::"; continue
            fi

            from=$(git -C "$d" rev-parse --short prod/main)
            to=$(git -C "$d" rev-parse --short staging/main)
            to_full=$(git -C "$d" rev-parse staging/main)

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$target" "$prod_url" "$prod" "$from" "$to" "$to_full" >> "$PLAN"
            planned="$planned $target"
            echo "ready: ${prod} main ${from} -> ${to}"
            echo "::endgroup::"
          done < "$WORK/configured.tsv"

          # Gate: refuse the whole run if any selected target is forked. Nothing has
          # been written yet, so this leaves production untouched rather than partly
          # promoted.
          if [ -n "$forked" ]; then
            echo "::error title=Promote aborted::forked trunk for:$forked — nothing was pushed. Reconcile and re-run."
            exit 1
          fi

          if [ -z "$planned" ]; then
            echo "Nothing to promote."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — would promote:$planned"
            exit 0
          fi

          # Fail closed rather than letting "green" degrade to "no requirements".
          if [ -z "$(printf '%s' "$PROMOTE_REQUIRED_CHECKS" | tr -d '[:space:]')" ]; then
            echo "::error title=Promote aborted::PROMOTE_REQUIRED_CHECKS is empty; refusing to promote without naming a check that must pass."
            exit 1
          fi

          # PASS 2 -- land. Every selected target has already passed its checks.
          #
          # EVERY promote goes through a reviewed pull request opened on the production
          # repo. That is the default and the only path -- not a fallback discovered by a
          # failed push. Promotion publishes to repos that ship packages to PyPI and npm,
          # so it deserves a human look regardless of what branch protection happens to
          # require. Deriving the mode from protection made the review gate an accident of
          # configuration: remove a required check and promotes would silently start
          # landing unreviewed.
          #
          # The pull request is never MERGED by this workflow. These repos allow squash
          # only, and squash rewrites SHAs, which forks the production trunk from staging
          # and blocks all codegen until a human reconciles it. Instead the same commits
          # are staged on a branch, CI runs on those exact SHAs, and once green and
          # approved main is FAST-FORWARDED onto them. GitHub then closes the pull request
          # as merged and the trunks stay byte-identical.
          while IFS=$'\t' read -r target prod_url prod from to to_full; do
            echo "::group::land $target"
            d="$WORK/$target"

            # Fail closed on a lookup error: reading it as "no pull request" would let
            # the fast-forward below land unapproved commits.
            if ! pr=$(gh pr list --repo "$prod" --head "$PROMOTE_BRANCH" --state open --json number --jq '.[0].number // empty'); then
              echo "::error title=Promote blocked for ${target}::could not query pull requests on ${prod}; refusing to touch main without knowing whether one is in flight."
              blocked="$blocked $target"; echo "::endgroup::"; continue
            fi
            staged=$(git -C "$d" -c credential.helper= ls-remote "$prod_url" "refs/heads/$PROMOTE_BRANCH" | cut -f1)

            # --- an open pull request whose head matches staging: check the gates ---
            if [ -n "$pr" ] && [ "$staged" = "$to_full" ]; then
              if ! review=$(gh pr view "$pr" --repo "$prod" --json reviewDecision --jq '.reviewDecision // "NONE"'); then
                echo "::error title=Promote blocked for ${target}::could not read the review state of #${pr} on ${prod}."
                blocked="$blocked $target"; echo "::endgroup::"; continue
              fi

              # GitHub keeps EVERY check run ever created for a SHA, so the rollup is not
              # "the current state of CI" -- a check that failed and was later re-run to
              # green still contributes its original FAILURE, forever. Collapse it to one
              # entry per check name, and call a name pending if any of its runs is still
              # going. Without this collapse the `target-main` label applied below could
              # never clear validate-pr-base's first failing run, and the promote would
              # stay blocked for the life of the SHA.
              #
              # Collapsing by "newest wins" alone is NOT safe here. ci.yml skips lint,
              # build and test on a non-fork pull_request event, so each name carries a
              # SKIPPED placeholder alongside the real result from the push to
              # $PROMOTE_BRANCH -- and those placeholders have incoherent timestamps
              # (observed live: a SKIPPED `build` whose completedAt precedes its own
              # startedAt, and whose startedAt is later than the real run's). Sorting on
              # them can elect the placeholder and discard the only run that executed.
              # So prefer an entry that actually concluded pass or fail, and fall back to
              # the skipped ones only when nothing real ran.
              if ! rollup=$(gh pr view "$pr" --repo "$prod" --json statusCheckRollup); then
                echo "::error title=Promote blocked for ${target}::could not read the checks of #${pr} on ${prod}."
                blocked="$blocked $target"; echo "::endgroup::"; continue
              fi
              if ! checks=$(printf '%s' "$rollup" | jq -r --arg req "$PROMOTE_REQUIRED_CHECKS" '
                    def key: (.name // .context // "?");
                    def stamp: (.completedAt // .startedAt // .createdAt // "");
                    def running:
                      if (.status // null) != null then ((.status | ascii_upcase) != "COMPLETED")
                      else (((.state // "") | ascii_upcase) | . == "PENDING" or . == "EXPECTED") end;
                    def outcome:
                      ((.conclusion // .state // "") | ascii_upcase) as $c
                      | if ($c == "FAILURE" or $c == "ERROR" or $c == "CANCELLED" or $c == "TIMED_OUT"
                             or $c == "ACTION_REQUIRED" or $c == "STARTUP_FAILURE") then "fail"
                        elif $c == "SUCCESS" then "pass"
                        else "skip" end;
                    ( $req | split(" ") | map(select(length > 0)) ) as $required
                    | [ .statusCheckRollup[]? | {k: key, r: running, o: outcome, t: stamp} ]
                    | group_by(.k)
                    | map( . as $g
                           | ($g | map(select(.r | not))) as $done
                           | ($done | map(select(.o != "skip"))) as $real
                           | { name: $g[0].k,
                               running: ($g | map(.r) | any),
                               outcome: ( (if ($real | length) > 0 then $real else $done end)
                                          | sort_by(.t) | last | .o // "skip") } )
                    | . as $checks
                    | [ ([ $checks[] | select(.running | not) | select(.outcome == "fail") | .name ] | join(", ")),
                        ([ $checks[] | select(.running) | .name ] | join(", ")),
                        ([ $required[] | select( . as $n
                             | ([ $checks[] | select(.name == $n and (.running | not) and .outcome == "pass") ] | length) == 0 ) ] | join(", ")),
                        ($checks | length | tostring) ]
                    | join("\u001f")'); then
                echo "::error title=Promote blocked for ${target}::could not classify the checks of #${pr} on ${prod}."
                blocked="$blocked $target"; echo "::endgroup::"; continue
              fi
              # Split on US (0x1f), not tab. Tab is an IFS *whitespace* character, so
              # `read` collapses runs of it and drops leading empties -- an all-green
              # "\t\tlint" would land the third field in the first variable and report
              # passing checks as failing ones. US is not IFS whitespace and cannot occur
              # in a check name, so empty fields survive in position.
              case "$checks" in
                *$'\037'*$'\037'*$'\037'*) ;;
                *) echo "::error title=Promote blocked for ${target}::unreadable check summary for #${pr} on ${prod}."
                   blocked="$blocked $target"; echo "::endgroup::"; continue ;;
              esac
              IFS=$'\037' read -r failing pending unmet total <<< "$checks"

              # ci.yml in both production repos declines to run lint, build and test on a
              # tracking-only "codegen metadata" commit -- its job-level `if:` excludes
              # exactly that message on push events, and the pull_request event skips them
              # for any non-fork branch. Roughly half of every staging trunk's commits are
              # these, so requiring those checks on one would stall the promote forever
              # waiting for a signal the repo is configured never to emit.
              #
              # Honour that policy rather than subvert it: accept their absence for this
              # commit specifically. Every other gate still applies -- nothing may be
              # failing, nothing may still be running, and a human must still approve.
              #
              # This does not give up all signal. Only `lint` and `build` carry the
              # metadata clause; `test` does not, in either production repo, so it runs
              # for real on these commits and still has to reach SUCCESS to clear the
              # `failing`/`pending` gates above. If a target ever adds that clause to
              # `test` as well, this exemption stops being narrow and should be revisited.
              metadata_tip=0
              [ "$(git -C "$d" log -1 --format=%B "$to_full")" = "codegen metadata" ] && metadata_tip=1

              if [ -n "$failing" ]; then
                echo "::error title=Promote blocked for ${target}::#${pr} has failing check(s): ${failing}. Fix them on the staging trunk, not on this branch -- it is overwritten on every promote."
                blocked="$blocked $target"; echo "::endgroup::"; continue
              fi
              if [ -n "$pending" ]; then
                echo "#${pr}: check(s) still running (${pending}) — re-run once green."
                waiting="$waiting ${target}(#${pr})"; echo "::endgroup::"; continue
              fi
              # A rollup with nothing in it at all is not "still early" -- both production
              # repos run ci.yml on a push to any branch, so it means Actions never ran on
              # these commits. Say so distinctly instead of letting it look like a wait
              # that a re-run will clear.
              if [ "${total:-0}" -eq 0 ] && [ "$metadata_tip" != "1" ]; then
                echo "::error title=Promote blocked for ${target}::no check runs reported at all on ${to} in ${prod}. Actions may be disabled there, or ${PROMOTE_BRANCH} may be excluded from ci.yml's push trigger."
                blocked="$blocked $target"; echo "::endgroup::"; continue
              fi
              # The positive gate. Everything above only proves the absence of bad news,
              # which a truncated or unexpected rollup satisfies trivially.
              if [ -n "$unmet" ] && [ "$metadata_tip" != "1" ]; then
                echo "::warning title=Required checks have not passed for ${target}::#${pr} has no SUCCESS from: ${unmet}. If this persists, CI is not running on ${PROMOTE_BRANCH} in ${prod}, or that repo names these jobs differently — see PROMOTE_REQUIRED_CHECKS."
                waiting="$waiting ${target}(#${pr})"; echo "::endgroup::"; continue
              fi
              if [ "$metadata_tip" = "1" ] && { [ -n "$unmet" ] || [ "${total:-0}" -eq 0 ]; }; then
                echo "::warning title=Required checks skipped by design for ${target}::${to} is a tracking-only \"codegen metadata\" commit, which ci.yml declines to run, so ${unmet:-the required checks} never reported. Proceeding on the remaining checks and the approval."
              fi
              if [ "$review" != "APPROVED" ]; then
                echo "#${pr} is green but not approved (reviewDecision=${review}) — approve it, then re-run."
                waiting="$waiting ${target}(#${pr})"; echo "::endgroup::"; continue
              fi

              if ! err=$(git -C "$d" -c credential.helper= push "$prod_url" staging/main:refs/heads/main 2>&1); then
                echo "$err"
                echo "::error title=Promote failed for ${target}::#${pr} is green and approved but the fast-forward was refused."
                blocked="$blocked $target"; echo "::endgroup::"; continue
              fi
              pushed="$pushed $target"
              planned=$(printf '%s' "$planned" | sed "s/ $target\b//")
              echo "promoted ${from} -> ${to} via #${pr}"
              git -C "$d" -c credential.helper= push "$prod_url" --delete "refs/heads/$PROMOTE_BRANCH" >/dev/null 2>&1 || echo "::warning::could not delete ${PROMOTE_BRANCH} on ${prod}"
              echo "::endgroup::"; continue
            fi

            # --- an open pull request for commits staging has since moved past ---
            if [ -n "$pr" ]; then
              # Approvals survive a force-push here (dismiss_stale_reviews=false,
              # require_last_push_approval=false), so restaging onto the existing pull
              # request would let an approval of the old commits authorise new ones nobody
              # reviewed. Close it; a fresh pull request carries no reviews.
              #
              # This must fail CLOSED. If the close were swallowed and the branch
              # force-pushed anyway, the still-open pull request would silently acquire the
              # new head while keeping the old approval -- and the gate above would read
              # that on the next run as "approved" and fast-forward production onto commits
              # nobody has looked at.
              if ! gh pr close "$pr" --repo "$prod" --comment "Superseded: the staging trunk advanced to ${to} while this was open. Closing rather than force-pushing, because an approval here would otherwise carry over to commits nobody reviewed." >/dev/null; then
                echo "::error title=Promote blocked for ${target}::could not close superseded pull request #${pr} on ${prod}; refusing to force-push ${PROMOTE_BRANCH} while it is still open."
                blocked="$blocked $target"; echo "::endgroup::"; continue
              fi
              # Confirm rather than trust: a zero exit is not proof, and everything below
              # assumes no open pull request governs this branch.
              state=$(gh pr view "$pr" --repo "$prod" --json state --jq '.state // empty') || state=""
              if [ "$state" != "CLOSED" ]; then
                echo "::error title=Promote blocked for ${target}::#${pr} on ${prod} still reports state '${state:-unknown}' after the close; refusing to force-push ${PROMOTE_BRANCH}."
                blocked="$blocked $target"; echo "::endgroup::"; continue
              fi
            fi

            # --- stage the commits and open a pull request for them ---
            git -C "$d" -c credential.helper= push --force "$prod_url" "staging/main:refs/heads/$PROMOTE_BRANCH"
            body=$(printf '%s\n' \
              "Automated promote from the staging trunk, opened by stlc-promote.yml." \
              "" \
              "**Approve this pull request - do not click Merge.** Squash and rebase both rewrite SHAs, which forks the production trunk away from staging and blocks all codegen until someone reconciles them by hand. Merge commits are disabled on this repo." \
              "" \
              "Once CI is green here and this has one approval, re-run \`stlc-promote.yml\` in the config repo. It fast-forwards \`main\` onto these exact commits, GitHub closes this pull request as merged, and the trunks stay byte-identical.")

            # The `chore:` prefix and the `target-main` label are load-bearing, not
            # decoration. Both production repos run a lint-pr workflow that fails any pull
            # request whose title is not a Conventional Commit, and any pull request
            # targeting main that is neither from an allow-listed bot nor labelled
            # `target-main`. This App is on neither allow-list, so without both of these
            # every promote pull request would carry two failing checks by construction and
            # the gate above would never open for either target.
            if ! gh pr create --repo "$prod" --base main --head "$PROMOTE_BRANCH" \
                 --title "chore: promote staging ${to} to production" \
                 --label target-main \
                 --body "$body" >/dev/null; then
              echo "::error title=Promote blocked for ${target}::could not open the promote pull request on ${prod}. ${PROMOTE_BRANCH} now holds ${to}; re-running will retry."
              blocked="$blocked $target"; echo "::endgroup::"; continue
            fi
            if ! pr=$(gh pr list --repo "$prod" --head "$PROMOTE_BRANCH" --state open --json number --jq '.[0].number // empty') || [ -z "$pr" ]; then
              echo "::error title=Promote blocked for ${target}::opened a promote pull request on ${prod} but could not read its number back."
              blocked="$blocked $target"; echo "::endgroup::"; continue
            fi
            # gh may apply labels in a follow-up call, in which case the `opened` event
            # fires before the label lands and validate-pr-base fails once. Re-assert it:
            # the check re-runs on `labeled`, and the gate above reads the newest result
            # per check name, so the superseded failure does not latch.
            gh pr edit "$pr" --repo "$prod" --add-label target-main >/dev/null 2>&1 \
              || echo "::warning title=Could not label #${pr} on ${prod}::add 'target-main' by hand, or its validate-pr-base check will keep this promote blocked."
            echo "staged ${to} on ${PROMOTE_BRANCH}; pull request #${pr} awaiting checks + approval"
            waiting="$waiting ${target}(#${pr})"
            echo "::endgroup::"
          done < "$PLAN"

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.STLC_ALERT_WEBHOOK_URL }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="stlc promote failed in ${{ github.repository }}. Production trunks may be partially promoted — check the step summary before re-running. Run: $run_url"
          echo "::error title=stlc promote failed::$msg"
          { echo "### ⚠️ stlc promote failed"; echo ""; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ALERT_WEBHOOK_URL:-}" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg text "$msg" '{text:$text}')" "$ALERT_WEBHOOK_URL" \
              || echo "::warning::Alert webhook POST failed"
          fi
